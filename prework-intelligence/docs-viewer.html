    "raw": "# Autorun Rules\n\n这份文件定义 Codex 在不需要用户逐步输入命令时，如何继续推进文档化阶段。\n\n## 执行规则\n\n- Codex 每次只能执行一个 current phase。\n- 完成一个 phase 后，必须运行 `CHECKLIST.md`。\n- 验证通过后，必须提交 Git。\n- 提交后，必须把 `NEXT_ACTION.md` 更新到下一个允许推进的 phase。\n- 如果下一个 phase 是 `hard stop`，必须停止。\n- 自检不能替代 Judgment review。自检只检查范围、文件、格式和一致性。\n\n## Hard Stops\n\n出现以下情况时，Codex 必须停止，并把问题写进 `BLOCKED` section：\n\n- 需要修改 `templates`、`method`、`scoring-rules` 或 `judgment-module`。\n- 核心方法文件之间出现明显字段不一致。\n- 当前阶段需要运行未授权 case。\n- 当前阶段需要新增 code、crawler、agent、RAG、reranker、adapter 或 automation implementation。\n\n## 禁止改动\n\n如果出现禁止改动，Codex 必须只撤回自己造成的禁止改动，然后停止。\n\n禁止改动包括：\n\n- 在未授权阶段新增 `cases` 或运行真实案例。\n- 新增 scripts、crawlers、agents、RAG、rerankers、platform adapters 或 automation code。\n- 通过 strategy cards 修改 Judgment Module 行为。\n- 让 Search Module artifacts 输出 Judgment 结论。\n"

    "raw": "# Verification Checklist\n\n每个无人值守阶段或已授权案例阶段结束后，运行这份检查清单。\n\n## Git\n\n- 运行 `git status --short --branch`。\n- 运行 `git diff --check`。\n\n## 占位符检查\n\n- 搜索 `TODO`、`TBD`、`FIXME` 和 `??`。\n- 命中内容必须是有意保留的说明文本，或者在提交前修掉。\n\n## 禁止产物检查\n\n- 在 strategy-card 阶段，确认没有新增 `cases` 目录。\n- 在已授权 case 阶段，确认只新增当前 case 目录和允许的 case 文件。\n- 确认没有新增 scripts、crawlers、agents、RAG、rerankers、platform adapters 或 automation code。\n- 确认没有新增当前阶段之外的 strategy card。\n\n## 策略卡边界\n\n- 检查 strategy cards 是否只服务 Search Module。\n- 检查 strategy cards 是否没有输出 Judgment 结论。\n- 检查 strategy cards 是否只把结果交给 Evidence Pack。\n\n## 架构边界\n\n- 检查 Search Module 和 Judgment Module 是否仍然分离。\n- 检查 Search Module 是否只输出 Evidence Pack records。\n- 检查 Judgment Module 是否只读取 Evidence Pack records。\n\n## 同步检查\n\n- 检查 `strategy-cards/README.md` 的 Available Strategy Cards 是否同步。\n- 检查 `current-state.md` 是否同步。\n- 检查 `NEXT_ACTION.md` 是否指向正确的下一阶段。\n"

    "path": "language-guide.md",
    "title": "Language Guide",
    "group": "Controls",
    "raw": "# Language Guide\n\n这份文件说明 Prework Intelligence 文档应该用中文、英文还是中英混合。\n\n## 总原则\n\n面向人阅读的说明用中文优先。\n\n面向接口、字段、文件名、query 模板和跨工具约定的内容保留英文。\n\n不要为了中文化而改动字段名。`entity_id`、`relevance_score`、`reuse_score`、`source_grade`、`evidence_status`、`method_similarity` 和 `method_note` 这类字段应保持英文。\n\n## 建议分层\n\n| 文件类型 | 推荐语言 | 原因 |\n| --- | --- | --- |\n| 状态和推进文件 | 中文优先，保留 phase/status 关键字 | 这些文件主要给人读，用来判断现在走到哪一步。 |\n| 方法解释文件 | 中文优先，字段名保留英文 | 方法需要被快速理解，但字段名要稳定。 |\n| 模板文件 | 中英混合 | 标题和说明可以中文，字段名和结构键保持英文，方便复制到 Evidence Pack。 |\n| Evidence Pack | 中英混合 | 字段名英文，证据摘要和 gaps/risks 可用中文。 |\n| Judgment Report | 中文优先 | 判断是给用户看的，结论词本来就是中文。 |\n| Strategy Cards | 中文优先，query templates 保留英文 | 搜索策略需要读得懂，但查询模板通常直接复制到英文搜索。 |\n| 外部来源标题和 URL | 保持原文 | 避免误引、误译或影响复核。 |\n| HTML 展示页 | 中文优先 | 它是阅读入口，不是接口规范。 |\n\n## 双轨文档规则\n\n从 Case 校准阶段开始，允许同一份 case 输出同时存在英文权威版和中文阅读版。\n\n| 文件后缀 | 用途 | 约束 |\n| --- | --- | --- |\n| `.md` | 英文权威版，供模型读取、继续修改和模块交接使用。 | 字段名、枚举、引用 ID 和表格结构保持稳定。 |\n| `.zh.md` | 中文阅读版，供用户审查、介入和复盘使用。 | 不新增证据、不改结论、不替换引用 ID，只翻译和解释权威版内容。 |\n\n中文阅读版必须在开头声明其源文件和权威状态。例如：\n\n```md\n源文件：`judgment-report.md`\n权威状态：中文阅读副本，不作为 Evidence Pack / Judgment Module 的唯一交接文件。\n```\n\n如果 `.md` 和 `.zh.md` 发生冲突，以同目录下的 `.md` 权威版为准。修正流程应先改权威版，再同步中文阅读版。\n\n展示页应优先把 `.zh.md` 作为面向用户的阅读入口，同时保留英文权威版入口，便于模型、复核者或后续 agent 使用。\n\n## 哪些内容应该保留英文\n\n- 文件名和目录名。\n- Markdown 模板中的字段名。\n- `entity_id`、`negative_evidence_id`、`source_grade` 等接口字段。\n- `confirmed`、`single-source`、`conflicting`、`unverified` 等枚举值。\n- query templates。\n- 外部 source title、URL、repo 名、issue 标题。\n- Git commit message 可以继续用英文，便于历史检索。\n\n## 哪些内容应该改成中文\n\n- 当前状态、路线图、下一步、停止规则。\n- 方法目的、使用说明、边界解释。\n- case 背景、结论理由、复盘。\n- strategy card 的 Purpose、When To Use、Execution Steps、Stopping Rules 等说明性段落。\n- HTML 展示页中的分组、说明和阅读顺序。\n\n## 当前调整状态\n\n已处理入口和控制层：\n\n- `current-state.md`\n- `ROADMAP.md`\n- `NEXT_ACTION.md`\n- `CHECKLIST.md`\n- `AUTORUN.md`\n- `framework-map.html`\n\n已处理 Case 1：\n\n- `cases/codex-sidebar-title-management/idea-card.md`\n- `cases/codex-sidebar-title-management/search-plan.md`\n- `cases/codex-sidebar-title-management/evidence-pack.md`\n- `cases/codex-sidebar-title-management/judgment-report.md`\n- `cases/codex-sidebar-title-management/case-retrospective.md`\n\n核心方法文件、模板和 strategy cards 暂不整篇翻译，避免一次性改动过大。后续可以按“先方法说明，再策略卡说明，最后模板说明”的顺序逐步中文化。\n\n双轨试点已启动，优先为最需要人工审查的 Case Judgment Report 增加中文阅读版。\n"

    "path": "method.md",
    "title": "Prework Intelligence V1 Method",
    "group": "Core Method",
    "raw": "# Prework Intelligence V1 Method\n\nThis document defines the Phase 1 workflow and module boundary for Prework Intelligence V1.\n\n## Purpose\n\nPrework Intelligence helps decide whether a rough idea, work problem, or tool need should be pursued from scratch, adapted from existing work, or paused for more evidence.\n\nV1 is a semi-structured documentation workflow. It is not an autonomous research agent. The first phase establishes method documents and templates only.\n\n## Core Flow\n\nThe workflow has one strict handoff:\n\n```text\nIdea Card\n  -> Search Module\n  -> Evidence Pack\n  -> Judgment Module\n  -> Judgment Report\n```\n\nThe Evidence Pack is the only interface between Search and Judgment. Search gathers and normalizes evidence. Judgment reads that evidence and makes, withholds, or requests support for a conclusion.\n\nAn Evidence Pack can be a single file or a declared Evidence Pack bundle. A bundle may include a base Evidence Pack plus dated addenda when a case is updated without rewriting the original pack. The bundle is still one logical handoff input, and every cited entity or negative evidence record must appear in one of the declared bundle files.\n\nV1.1 adds a lightweight claim layer above entity records:\n\n```text\nIdea Card\n  -> Claim Decomposition\n  -> Search Module\n  -> Entity Records + Capability Claim Matrix\n  -> Judgment Module\n  -> Primary Conclusion + Claim Matrix\n```\n\nEntity records still group evidence by object. Capability claims describe what is true for a specific subproblem, surface, lifecycle stage, and freshness state.\n\n## Relation To Existing Work Search Design\n\n`docs/superpowers/specs/2026-06-10-existing-work-search-design.md` is the Phase 0 search-only design.\n\nIt answers only how to search for whether comparable work already exists.\n\nPrework Intelligence V1 is a search + judgment workflow. It uses the Phase 0 file as a foundation for Search Module principles, but not as the final Judgment specification.\n\nDo not delete or overwrite the Phase 0 file. Prework Intelligence V1 extends it by adding the Evidence Pack handoff and Judgment Module boundary.\n\n## Module Boundary\n\nSearch Module responsibilities:\n\n- rewrite a rough idea into searchable dimensions;\n- decompose broad ideas into stable `claim_id` records before search;\n- produce a search plan;\n- collect and normalize evidence in an Evidence Pack;\n- assign entity-level `entity_id`, `relevance_score`, `reuse_score`, `method_similarity`, `method_note`, `source_grade`, and `evidence_status`;\n- record claim-level `surface_scope`, `lifecycle_scope`, `freshness_status`, supporting records, `claim_evidence_status`, and gaps in the Capability Claim Matrix;\n- record information gaps and negative search scope.\n\nSearch Module must not:\n\n- recommend `放弃不做`, `直接采用`, `接入改造`, `场景定制`, `补齐缺口`, `自研小样`, or `先补证据`;\n- produce the final Judgment Report;\n- hide missing evidence behind confident language.\n\nJudgment Module responsibilities:\n\n- read one Evidence Pack;\n- cite Evidence Pack `entity_id` or `negative_evidence_id` values for every conclusion;\n- use the Capability Claim Matrix to separate local claim judgments from the single primary conclusion;\n- choose one allowed conclusion when the evidence supports it;\n- output `先补证据` when evidence is insufficient.\n\nJudgment Module must not:\n\n- call search tools;\n- browse the web;\n- inspect external sources;\n- add new evidence;\n- cite URLs that are not already present in the Evidence Pack.\n\n## Phase Boundaries\n\nPhase 1 creates method documents and templates under `docs/prework-intelligence`.\n\nPhase 1 does not create:\n\n- example cases;\n- strategy-card files;\n- crawlers;\n- agents;\n- rerankers;\n- RAG stores;\n- platform adapters;\n- automation scripts.\n\nLater phases may add cases and strategy cards only after the Phase 1 templates are reviewed.\n\n## V1 Operating Rules\n\n- Use a file-based workflow first. Do not automate until repeated cases show stable fields.\n- Keep search and judgment separate even when the same person performs both roles.\n- Decompose broad cases into claim-level records before judging product capability, surface support, or lifecycle behavior.\n- Treat scores as structured initial judgments, not mathematical truth.\n- Prefer source-specific evidence over generic summaries.\n- Record what was not searched so the report cannot imply false completeness.\n- Stop judgment when required evidence is missing; issue a supplement-evidence request instead.\n\n## Conclusion Glossary\n\n- `放弃不做`: Existing evidence shows the work is not worth pursuing now.\n- `直接采用`: A sufficiently fitting existing solution can be used as-is.\n- `接入改造`: Existing work can cover the base need if integrated, wrapped, or lightly adapted.\n- `场景定制`: A general solution exists, but the user's domain needs a focused variant.\n- `补齐缺口`: Prior work covers the foundation, and the main value is finishing missing workflow, UX, or operational pieces.\n- `自研小样`: No suitable reusable base is evident, so a small in-house prototype is justified.\n- `先补证据`: The Evidence Pack is not sufficient for a responsible judgment.\n\n## Valid Work Product\n\nPhase 1 is complete when the method files and templates exist, encode the strict module boundary, and can be used later to run a case without adding new design decisions.\n"
  },

    "title": "Search Module",
    "group": "Core Method",
    "raw": "# Search Module\n\nThis document defines what the Search Module may produce and what it must leave to Judgment.\n\n## Role\n\nThe Search Module turns a rough idea into a structured Evidence Pack. It is responsible for recall, normalization, source notes, and evidence gaps.\n\nThe handoff output to the Judgment Module is only `evidence-pack.md`.\n\n## Inputs\n\nThe Search Module may use:\n\n- an Idea Card;\n- a Search Plan;\n- user-provided constraints;\n- source-selection rules from the method.\n\nThe Search Plan is a planning artifact for the search worker. It is not a judgment artifact and must not be used by the Judgment Module as evidence.\n\n## Outputs\n\nThe Search Module must produce an Evidence Pack with:\n\n- case metadata;\n- coverage summary;\n- query log;\n- entity-level evidence records;\n- capability claim matrix records;\n- information gaps;\n- negative search scope;\n- searcher's notes about uncertainty.\n\nEvery entity record must include:\n\n- `entity_id`, using stable local IDs such as `E001`, `E002`, `E003`;\n- `entity_name`;\n- `entity_type`;\n- `core_function`;\n- `relevance_score`;\n- `reuse_score`;\n- `method_similarity`;\n- `method_note`;\n- `source_grade`;\n- `evidence_status`;\n- `main_source`;\n- `support_sources`;\n- `key_facts`;\n- `gaps`;\n- `risks`.\n\nEvery capability claim record must include:\n\n- `claim_id`, using stable local IDs such as `C001`, `C002`, `C003`;\n- `claim`;\n- `surface_scope`;\n- `lifecycle_scope`;\n- `freshness_status`;\n- `supporting_entities`;\n- `supporting_negative_evidence`;\n- `claim_evidence_status`, using the same values as `evidence_status`;\n- `gaps`.\n\n## Prohibited Outputs\n\nThe Search Module must not output:\n\n- final go/no-go recommendations;\n- build-vs-buy conclusions;\n- implementation plans;\n- product strategy;\n- untracked evidence outside the Evidence Pack.\n\nIf the searcher has an opinion about likely direction, it belongs outside the handoff artifact. The Evidence Pack should remain usable by a separate Judgment Module.\n\n## Entity Aggregation\n\nThe Search Module groups results by entity, not by URL.\n\nAn entity may be:\n\n- an open-source project;\n- a commercial product;\n- an academic method;\n- a patent or standard;\n- a forum-described workflow;\n- an official feature;\n- an internal or local tool if the user provides it as allowed evidence.\n\nMultiple URLs about the same entity should become one entity record with a main source and support sources.\n\n## Scoring Responsibilities\n\nThe Search Module assigns initial scores and labels:\n\n- `relevance_score`: similarity to the original idea;\n- `reuse_score`: practical reusability for the user's work;\n- `method_similarity`: similarity of technical route, implementation style, or core method;\n- `method_note`: short explanation of the method comparison;\n- `source_grade`: source authority for the specific claim;\n- `evidence_status`: confirmation state of the entity's key claims.\n\nThe module must not collapse these fields into a single confidence score.\n\nWhen a `reuse_score` applies only to a specific claim or surface, record `score_scope` in the relevant entity notes, such as `claim:C001` or `surface:app_server`. If no scope is recorded, Judgment should treat the score as entity-level only.\n\n## Current Product Capability Gate\n\nWhen the case asks whether a current product capability exists, the Search Module must check current official sources before treating older issues or community posts as evidence of present gaps.\n\nFor fast-changing products, search in this order:\n\n- official changelog, release notes, or current docs;\n- current UI or user-observed evidence when allowed and safe;\n- official issues, community posts, or older discussions;\n- third-party summaries or adjacent products.\n\nOlder issues can record historical pain or missing features at the time they were filed. They must not be treated as current missing-feature evidence unless the Evidence Pack records a freshness check showing the gap still applies.\n\n## Insufficient Evidence\n\nIf evidence is weak, the Search Module records:\n\n- missing source types;\n- query families not yet tried;\n- claims with only single-source support;\n- entities with conflicting evidence;\n- likely places where missed evidence may exist.\n\nThe Search Module does not decide whether the idea should proceed. It only makes the Evidence Pack honest about its limits.\n\n## Completion Criteria\n\nA Search Module run is complete when:\n\n- planned source types are marked searched or explicitly unsearched;\n- query logs record what was searched and where;\n- useful results are grouped into entities;\n- each entity has required scoring fields, including `method_similarity` and `method_note`;\n- capability claims have `claim_id`, `surface_scope`, `lifecycle_scope`, `freshness_status`, supporting records, and gaps;\n- information gaps and negative search scope are explicit;\n- no final judgment is included.\n"
  },

    "path": "judgment-module.md",
    "title": "Judgment Module",
    "group": "Core Method",
    "raw": "# Judgment Module\n\nThis document defines how the Judgment Module reads Evidence Packs and when it must request more evidence.\n\n## Role\n\nThe Judgment Module reads an Evidence Pack and produces a Judgment Report. It decides only from evidence already present in the pack.\n\nThe module must not search, browse, inspect external sources, call APIs, read new URLs, or add evidence. If the Evidence Pack is insufficient, the only valid output is `先补证据`.\n\n## Input Contract\n\nThe only input is one Evidence Pack or one declared Evidence Pack bundle.\n\nAn Evidence Pack bundle may contain a base `evidence-pack.md` plus dated addenda for the same case. The Judgment Report must list every file in the bundle under `Evidence Pack Used`. The Judgment Module must treat the bundle as one logical input and must not read sources outside that declared bundle.\n\nThe Judgment Module may use:\n\n- entity records and their `entity_id` values;\n- capability claim matrix records and their `claim_id` values;\n- negative evidence records and their `negative_evidence_id` values;\n- source notes already captured in the Evidence Pack;\n- query logs already captured in the Evidence Pack;\n- gaps and negative search scope already captured in the Evidence Pack.\n\nWhen a bundle is used, cited `entity_id` and `negative_evidence_id` values may come from any declared bundle file, but the report must not cite records that are outside the bundle.\n\nThe Judgment Module must ignore:\n\n- external URLs not recorded in the Evidence Pack;\n- the judge's private knowledge;\n- search plans that are not reflected in the Evidence Pack;\n- claims that lack an entity record or negative evidence record.\n\n## Allowed Conclusions\n\nEach Judgment Report must choose exactly one primary conclusion:\n\n- `放弃不做`\n- `直接采用`\n- `接入改造`\n- `场景定制`\n- `补齐缺口`\n- `自研小样`\n- `先补证据`\n\nSecondary notes may explain tradeoffs, but they must not introduce a second primary conclusion.\n\nFor V1.1 Evidence Packs, the report should also include claim-level local conclusions. These local conclusions do not replace the single primary conclusion. They explain how different subproblems, surfaces, or lifecycle stages should be handled.\n\n## Conclusion Glossary\n\n- `放弃不做`: Existing evidence shows the work is not worth pursuing now.\n- `直接采用`: A sufficiently fitting existing solution can be used as-is.\n- `接入改造`: Existing work can cover the base need if integrated, wrapped, or lightly adapted.\n- `场景定制`: A general solution exists, but the user's domain needs a focused variant.\n- `补齐缺口`: Prior work covers the foundation, and the main value is finishing missing workflow, UX, or operational pieces.\n- `自研小样`: No suitable reusable base is evident, so a small in-house prototype is justified.\n- `先补证据`: The Evidence Pack is not sufficient for a responsible judgment.\n\n## Evidence Citation Rule\n\nEvery conclusion must cite one or more Evidence Pack `entity_id` or `negative_evidence_id` values.\n\nValid conclusion statements must include:\n\n- primary conclusion;\n- claim-level conclusion when using a Capability Claim Matrix;\n- cited `entity_id` or `negative_evidence_id` values;\n- why those evidence records support the conclusion;\n- what evidence gaps remain.\n\nThe report is invalid if a conclusion does not cite an `entity_id` or `negative_evidence_id`.\n\nFor `先补证据`, cite the `entity_id` or `negative_evidence_id` values that are too weak, conflicting, or incomplete. If no relevant evidence record exists, cite `none` and explain which missing evidence record type would be needed, such as entity record, source record, negative evidence record, or method comparison note.\n\nClaim-level `先补证据` may cite `none` only when the Evidence Pack has no relevant entity or negative evidence record for that claim. The report must then name the missing claim, surface, lifecycle stage, and evidence record type.\n\n## Negative Evidence Interpretation\n\nNegative evidence must not be interpreted as absolute non-existence.\n\nThe Judgment Module may only state that strong evidence was not found within the source classes, queries, and limits recorded by the Evidence Pack.\n\nNegative evidence cannot support claims like \"no one has done this\" or \"this does not exist.\" It can only support claims like \"no strong evidence was found within the covered search scope.\"\n\nIf negative evidence comes from narrow coverage, the Judgment Module should prefer `先补证据` over a confident conclusion.\n\n## Evidence Sufficiency\n\nUse `先补证据` when:\n\n- the strongest entity has low relevance and low reuse;\n- source coverage is too narrow for the decision;\n- key entities have `evidence_status: conflicting`;\n- a required source class is unsearched;\n- the Evidence Pack lacks `entity_id` or `negative_evidence_id` citations for the claims being considered;\n- a capability claim lacks `surface_scope`, `lifecycle_scope`, `freshness_status`, or supporting records needed for the local conclusion;\n- a needed key fact lacks a recorded supporting source or clear evidence status.\n\nThe request must specify:\n\n- missing source type or source class;\n- missing claim or comparison;\n- missing surface, lifecycle, or freshness record when relevant;\n- affected `entity_id` or `negative_evidence_id` values, or `none`;\n- missing evidence record type;\n- the decision that cannot be made until evidence is added.\n\n## Prohibited Behavior\n\nThe Judgment Module must not:\n\n- perform new search;\n- browse cited URLs;\n- inspect local files beyond the declared Evidence Pack or Evidence Pack bundle;\n- change scores in the Evidence Pack;\n- infer current product capability from stale issue records without a recorded freshness check;\n- add new entities;\n- add new negative evidence records;\n- cite evidence that is not in the Evidence Pack;\n- treat negative evidence as proof that no solution exists;\n- convert missing evidence into a confident conclusion.\n\n## Completion Criteria\n\nA Judgment Report is complete when:\n\n- it selects one allowed primary conclusion;\n- every conclusion cites `entity_id` or `negative_evidence_id` values, or a justified `none` for supplement requests;\n- claim-level local conclusions cite supporting records and do not replace the primary conclusion;\n- it distinguishes evidence-backed claims from gaps;\n- it recommends a next action that follows from the cited evidence records;\n- it does not contain new evidence.\n"
  },

    "path": "scoring-rules.md",
    "title": "Scoring Rules",
    "group": "Core Method",
    "raw": "# Scoring Rules\n\nThis document defines the separate scores and labels used by Evidence Packs and Judgment Reports.\n\n## Purpose\n\nScores and labels make Evidence Packs comparable across cases. They are structured estimates, not precise measurements.\n\nDo not use a single `confidence` number. Keep similarity, reusability, source authority, and evidence confirmation separate.\n\n## relevance_score\n\n`relevance_score` is entity-level. It measures how similar an entity is to the original idea.\n\nUse a 0-12 integer score across six dimensions:\n\n| Dimension | 0 | 1 | 2 |\n| --- | --- | --- | --- |\n| Problem | Different problem | Related problem | Same core problem |\n| User | Different user | Overlapping user | Same target user |\n| Input | Different input | Partly similar input | Same or equivalent input |\n| Output | Different output | Partly similar output | Same or equivalent output |\n| Workflow | Different workflow | Borrowable workflow | Closely matching workflow |\n| Constraint | Different constraints | Some shared constraints | Same key constraints |\n\nInterpretation:\n\n- `0-4`: generally related;\n- `5-7`: weakly similar;\n- `8-10`: strongly similar;\n- `11-12`: near-equivalent.\n\n## method_similarity\n\n`method_similarity` is entity-level. It records whether the technical route, implementation style, or core method is similar to the user's idea.\n\nWorkflow is not the same as method. Workflow describes how a user moves through the work; method describes the underlying approach used to solve it.\n\nUse:\n\n- `0`: different method;\n- `1`: partly similar or borrowable method;\n- `2`: closely similar method.\n\nUse `method_note` to explain the score in one or two sentences.\n\nRecord both of these cases when they appear:\n\n- same goal, different method;\n- same method, different goal.\n\nDo not add `method_similarity` into `relevance_score`. Keep `relevance_score` on its existing 0-12 scale.\n\n## method_note\n\n`method_note` is entity-level. It briefly states what method is used and how it compares with the user's intended method.\n\n## reuse_score\n\n`reuse_score` is entity-level. It measures how practically reusable the entity is for the user's work.\n\nUse a 0-10 integer score across five dimensions:\n\n| Dimension | 0 | 1 | 2 |\n| --- | --- | --- | --- |\n| Availability | Not accessible | Partly accessible | Directly accessible |\n| Documentation | Unclear | Partial | Clear enough to use |\n| Integration | Hard to connect | Moderate effort | Easy to integrate |\n| License or terms | Blocks reuse | Needs review | Reuse appears allowed |\n| Maintenance | Abandoned or unknown | Some activity | Active or stable |\n\nInterpretation:\n\n- `0-3`: not worth reusing;\n- `4-6`: reusable as reference only;\n- `7-8`: reusable with adaptation;\n- `9-10`: likely directly reusable.\n\n## score_scope\n\n`score_scope` is an optional lightweight qualifier for `reuse_score`.\n\nUse it only when the entity-level reuse score would be misleading across claims or surfaces. If no `score_scope` is recorded, treat `reuse_score` as a whole-entity summary.\n\nAllowed forms:\n\n- `whole_entity`\n- `claim:C001`\n- `surface:desktop_app`\n- `surface:vscode_extension`\n- `surface:cli`\n- `surface:app_server`\n- `surface:web_product`\n- `surface:remote_thread`\n- `surface:local_state`\n- `surface:cross_surface`\n\nExample: an official API may have `reuse_score: 8` with `score_scope: claim:C002` for app-server rename, while the same entity does not solve a batch governance claim.\n\n## source_grade\n\n`source_grade` measures source authority for the specific claim being used.\n\nUse:\n\n- `S`: official source, official repository, authoritative standard, peer-reviewed paper for a research claim, or primary documentation;\n- `A`: reputable expert source, active high-signal community record, well-maintained project metadata, or recognized institutional guidance;\n- `B`: ordinary blog, forum discussion, product listing, tutorial, or secondary summary;\n- `C`: marketing-only page, anonymous claim, SEO article, unverified aggregator, or weak indirect mention.\n\nGrades are claim-specific. A GitHub issue can be high value for user pain but weaker for feature support. A product homepage can confirm positioning but not independent effectiveness.\n\nEvidence Packs may keep an entity-level `source_grade` as a summary of the entity's strongest or most representative support.\n\nWhen a Key Fact explicitly records a supporting source and evidence status, Judgment should use that specific record. Otherwise, use entity-level `source_grade`.\n\n`source_grade` may therefore appear at source level and entity level. It may also appear in a lightweight Key Facts note when the Evidence Pack records one, but the Evidence Pack template does not require a structured facts table.\n\n## evidence_status\n\n`evidence_status` records whether the key claims about an entity are confirmed.\n\nUse:\n\n- `confirmed`: supported by at least two independent relevant sources, or by one authoritative primary source for a narrow factual claim;\n- `single-source`: supported by one relevant source;\n- `conflicting`: sources disagree on an important fact;\n- `unverified`: mentioned but not supported enough to rely on.\n\nDo not upgrade `evidence_status` because a claim sounds plausible. Use only recorded Evidence Pack sources.\n\nEvidence Packs may keep an entity-level `evidence_status` as a summary of the entity's overall support.\n\nWhen a Key Fact explicitly records a supporting source and evidence status, Judgment should use that specific record. Otherwise, use entity-level `evidence_status`.\n\nJudgment should not treat an entity-level `confirmed` label as confirmation of every fact about that entity.\n\n## Level Summary\n\n- `relevance_score`: entity-level only.\n- `method_similarity`: entity-level only.\n- `method_note`: entity-level only.\n- `reuse_score`: entity-level by default, optionally qualified by `score_scope`.\n- `score_scope`: optional qualifier for claim-specific or surface-specific reuse.\n- `source_grade`: source-level and entity-level, with optional Key Facts notes when recorded.\n- `evidence_status`: entity-level, with optional Key Facts notes when recorded.\n- `claim_evidence_status`: claim-level, using the same values as `evidence_status`.\n\n## Score Use In Judgment\n\nJudgment can use scores to compare entities, but it must cite `entity_id` or `negative_evidence_id` values and explain the reasoning.\n\nHigh `relevance_score` without high `reuse_score` may support `补齐缺口`, `场景定制`, or `自研小样`.\n\nHigh `reuse_score` with strong relevance may support `直接采用` or `接入改造`.\n\nLow scores or weak `evidence_status` should usually trigger `先补证据` unless the decision is explicitly low stakes.\n\n## Conclusion Glossary\n\n- `放弃不做`: Existing evidence shows the work is not worth pursuing now.\n- `直接采用`: A sufficiently fitting existing solution can be used as-is.\n- `接入改造`: Existing work can cover the base need if integrated, wrapped, or lightly adapted.\n- `场景定制`: A general solution exists, but the user's domain needs a focused variant.\n- `补齐缺口`: Prior work covers the foundation, and the main value is finishing missing workflow, UX, or operational pieces.\n- `自研小样`: No suitable reusable base is evident, so a small in-house prototype is justified.\n- `先补证据`: The Evidence Pack is not sufficient for a responsible judgment.\n"
  },

    "path": "source-selection.md",
    "title": "Source Selection",
    "group": "Core Method",
    "raw": "# Source Selection\n\nThis document defines minimum source coverage for Prework Intelligence searches by problem type and search level.\n\n## Purpose\n\nSource selection prevents a search from looking complete just because one convenient source returned plausible results.\n\nThe Search Module uses this document to decide which source classes are required, which are optional, and when an Evidence Pack can mark source coverage as sufficient.\n\n## Search Levels\n\n- `L1 quick scan`: fast check for obvious prior work or substitutes.\n- `L2 standard scan`: normal prework review across the most relevant source classes.\n- `L3 deep review`: higher-stakes review with cross-source validation and stronger negative evidence.\n\n## Source Status\n\n- `required`: must be searched or explicitly listed as an information gap.\n- `optional`: useful when relevant, but not required for sufficiency unless the case depends on it.\n\nIf a required source cannot be searched, source coverage is not sufficient. The Evidence Pack must record why it was not searched and what decision risk remains.\n\n## Software Or Tooling\n\n| Level | Required sources | Optional sources |\n| --- | --- | --- |\n| L1 | General web; GitHub or primary open-source host | Package registries; official docs |\n| L2 | General web; GitHub or primary open-source host; package registries; official docs; GitHub Issues or relevant developer community | Product directories; app stores; papers |\n| L3 | L2 required sources; alternative code hosts; changelogs or releases; issue trackers; security or license sources | Patents; benchmark reports; maintainer discussions |\n\nCoverage is sufficient when the required source classes were searched and the Evidence Pack either records the most relevant entities or explains why no strong entities were found.\n\nMust supplement evidence when GitHub or the primary open-source host is unsearched, when license or maintenance status is needed for reuse, or when only blog posts support an implementation claim.\n\nFor current product capability questions at L2 or higher, official changelog, release notes, or current docs must be checked before older issues are used as current gap evidence. The Evidence Pack must record whether current UI or user-observed evidence was available and safe to use. If not, record it as an information gap rather than inferring current behavior from stale issue records.\n\n## Product Or Competitor\n\n| Level | Required sources | Optional sources |\n| --- | --- | --- |\n| L1 | General web; product homepage or product directory | AlternativeTo; Product Hunt; app stores |\n| L2 | General web; product homepage; product directories; review or comparison sites; user communities | Pricing pages; changelogs; help docs |\n| L3 | L2 required sources; official docs; reviews from multiple communities; comparison pages; market or procurement sources | Analyst reports; customer case studies; app-store reviews |\n\nCoverage is sufficient when direct competitors, indirect substitutes, and at least one user-facing evidence source were checked.\n\nMust supplement evidence when only vendor pages were searched, when no indirect substitutes were considered, or when reuse depends on pricing, terms, or integration that was not checked.\n\n## Research Or Method\n\n| Level | Required sources | Optional sources |\n| --- | --- | --- |\n| L1 | General web; Google Scholar, Semantic Scholar, OpenAlex, arXiv, or another relevant academic index | Review papers; library guides |\n| L2 | Academic index; review or survey papers; highly cited or recent papers; reference chasing from one close paper | GitHub implementations; datasets; benchmark pages |\n| L3 | L2 required sources; systematic or scoping reviews when available; citation chasing forward and backward; implementation or dataset sources | Standards; patents; expert commentary |\n\nCoverage is sufficient when the Evidence Pack identifies close methods, their maturity, and whether they are operational, experimental, or only conceptual.\n\nMust supplement evidence when no academic index was searched, when only abstracts were used for technical claims, or when a method's practical reuse depends on code or data that was not checked.\n\n## Patent Or Invention\n\n| Level | Required sources | Optional sources |\n| --- | --- | --- |\n| L1 | General web; Google Patents, USPTO, WIPO, Espacenet, or another patent database | Non-patent literature |\n| L2 | Patent database; keyword variants; assignee or inventor search; classification search when obvious | Foreign patent databases; technical papers |\n| L3 | L2 required sources; multiple patent databases; classification expansion; cited and citing patents; non-patent literature | Legal review; freedom-to-operate analysis |\n\nCoverage is sufficient only as a prework signal, not as legal advice. The Evidence Pack must describe searched patent databases and whether non-patent literature was checked.\n\nMust supplement evidence when no patent database was searched, when only exact-name terms were used, or when the case needs patentability, infringement, or freedom-to-operate conclusions.\n\n## Vertical Business Process\n\n| Level | Required sources | Optional sources |\n| --- | --- | --- |\n| L1 | General web; industry-specific web search; official or regulatory source if applicable | Vendor pages; practitioner forums |\n| L2 | General web; industry-specific sources; official guidance or regulation; vendor or workflow products; practitioner communities | Academic papers; patents; internal examples provided by the user |\n| L3 | L2 required sources; standards; regulations; mature vendor docs; workflow case studies; failure or complaint sources | Expert interviews; procurement documents; local operational manuals |\n\nCoverage is sufficient when the Evidence Pack checks the domain's official constraints, existing workflow products or methods, and user pain or failure evidence.\n\nMust supplement evidence when official or regulatory constraints are relevant but unsearched, when only generic tools were checked, or when the workflow depends on local practice not represented in the Evidence Pack.\n\n## General Sufficiency Rules\n\nSource coverage can be marked sufficient when:\n\n- every required source class for the selected problem type and level is searched or explicitly justified as not applicable;\n- query logs record source class, source name, query, result count, and kept entities;\n- current product capability claims record a release or changelog check when relevant;\n- key facts are linked to recorded sources in the Evidence Pack;\n- negative evidence records describe where strong evidence was not found;\n- remaining gaps are unlikely to change the primary judgment.\n\nThe Search Module must request or perform supplement search when:\n\n- a required source class is unsearched;\n- an entity has high relevance but weak `evidence_status`;\n- a judgment-critical fact lacks a recorded supporting source or clear evidence status;\n- negative evidence is based on too narrow a source set;\n- source coverage does not match the declared search level;\n- the Judgment Module returns `先补证据`.\n\n## Negative Evidence Limit\n\nNegative evidence never proves non-existence. It only means strong evidence was not found within the recorded source coverage.\n\nEvidence Packs must state the covered source classes beside negative evidence so Judgment can avoid overreading it.\n"
  },

    "path": "case-catalog.md",
    "title": "Case Calibration Catalog",
    "group": "Core Method",
    "raw": "# Case Calibration Catalog\n\nThis catalog lists candidate cases for calibrating Prework Intelligence. It is a backlog, not authorization to run all cases.\n\n## Purpose\n\nThe case set is designed to expose workflow defects, calibrate fields, and test whether Search and Judgment stay separated.\n\nCases should cover different source-selection routes: software/tooling, product/competitor, research/method, vertical business process, and meta-framework comparison.\n\nDo not create a case directory until that case is selected for execution.\n\n## Recommended Execution Order\n\n| order | case_id | case | why first |\n| ---: | --- | --- | --- |\n| 1 | A1 | Codex sidebar title management regression | Existing failure sample; best test for V1.1 claim matrix, surface scope, and freshness. |\n| 2 | E1 | Existing skill / agent workflow framework comparison | Tests whether the framework should learn from mature skill systems without copying their complexity. |\n| 3 | B1 | Desktop always-available AI floating assistant | Roadmap Case 2; tests product substitution and current user-facing utility. |\n| 4 | D1 | PDF-VLLM ICU nursing-record extraction improvement | Tests privacy-sensitive vertical workflow and internal-project constraints. |\n| 5 | C1 | PINN + ILW prior work | Tests academic prior work, method similarity, and baseline separation. |\n\nRun only one case at a time. After each case, update the retrospective before selecting the next case.\n\n## Calibration Backlog\n\n### A1 - Codex sidebar title management regression\n\n- case_type: Calibration\n- search_level: L2 standard scan\n- tests: Claim Matrix; `surface_scope`; `freshness_status`; Current Product Capability Gate\n- must_discover: manual rename, app-server rename API, fork or branch title lifecycle, legacy title handling, batch governance are separate claims.\n- must_not_misjudge: do not describe Codex title management as wholly missing; do not treat old issues as current product gaps.\n- pass_signal: Judgment expresses manual rename as existing capability while batch, fork, and legacy governance remain gaps or supplement-evidence requests.\n\n### A2 - Open-source patcher as formal solution\n\n- case_type: Calibration\n- search_level: L2, L3 if license and compatibility are decision-critical\n- tests: GitHub Implementation Search; `reuse_score`; risks; What Not To Do\n- must_discover: file patching behavior, license, maintenance signal, target surface, backup, verification, rollback, official support status.\n- must_not_misjudge: do not recommend `直接采用` only because a repo is functionally similar.\n- pass_signal: Judgment distinguishes workaround, reference implementation, and safe default path.\n\n### A3 - Fast-changing current product capability\n\n- case_type: Calibration\n- search_level: L2 standard scan\n- tests: `freshness_status`; release timeline; issue staleness detection\n- must_discover: official changelog, current docs, issue date versus release date, and current UI or user-observed evidence when allowed.\n- must_not_misjudge: do not let stale issues override newer official release evidence.\n- pass_signal: Evidence Pack has a clear timeline and Judgment treats old issues as historical unless freshness is confirmed.\n\n### B1 - Desktop always-available AI floating assistant\n\n- case_type: Real Exploration\n- search_level: L2 standard scan\n- tests: Product Competitor Search; GitHub Implementation Search; `surface_scope`; privacy constraints; product substitution\n- must_discover: browser sidebars, desktop floating windows, local LLM tools, OpenAI-compatible API support, page or active-window context capture, Windows support, permissions.\n- must_not_misjudge: do not treat browser sidebar or ordinary chat overlay as a global desktop assistant with page-context access.\n- pass_signal: Judgment separates direct-use tools, configurable API-key tools, UI-pattern references, and tools that fail context-reading requirements.\n\n### B2 - AGENTS.md / CLAUDE.md best practices\n\n- case_type: Real Exploration\n- search_level: L2 standard scan\n- tests: source authority grading; pattern aggregation; cross-tool comparison; `method_similarity`\n- must_discover: official docs, real repo examples, community experience, risk of overconstraint, file-name and loading-rule differences.\n- must_not_misjudge: do not treat one user's template as a general standard or copy Claude Code rules directly into Codex.\n- pass_signal: Report produces reusable rule categories and fit limits, not only links.\n\n### B3 - Obsidian plus coding-agent knowledge workflow\n\n- case_type: Real Exploration\n- search_level: L2 standard scan\n- tests: product versus workflow substitute; private-source policy; Unacceptable Substitutes; workflow-pattern gap\n- must_discover: Obsidian plugins, Git-based docs workflows, AI agent memory systems, Markdown-first context, bidirectional sync, RAG or embeddings dependence, privacy risk.\n- must_not_misjudge: do not treat ordinary Obsidian AI plugins as stable coding-agent project context.\n- pass_signal: Claim Matrix separates note management, agent context injection, long-term memory, and task sync.\n\n### B4 - Free large-file translation tool combination\n\n- case_type: Real Exploration\n- search_level: L2 standard scan\n- tests: Product Competitor Search; pricing and access model; privacy risk; terms coverage\n- must_discover: file size limits, supported formats, real free limits, batching, upload privacy, local translation alternatives, API or desktop substitutes.\n- must_not_misjudge: do not treat short-text translation pages as large-file translation tools.\n- pass_signal: Report groups online free, freemium, local open-source, and paid reliable options with limits.\n\n### C1 - PINN + ILW prior work\n\n- case_type: Stress Test\n- search_level: L3 deep review\n- tests: Paper Prior Work Search; `method_similarity`; same method different goal; baseline identification\n- must_discover: PINN hard constraints, weak or soft boundary constraints, inverse Lax-Wendroff boundary handling, related PDE domains, code, benchmark, baseline.\n- must_not_misjudge: do not treat generic PINN boundary constraints or numerical ILW alone as direct ILW-PINN prior work.\n- pass_signal: Prior work map separates direct, adjacent, baseline, and unrelated work.\n\n### C2 - X-Net / FFT-XNet for PDE solving with ILW\n\n- case_type: Stress Test\n- search_level: L2 or L3\n- tests: method transfer; research source coverage; negative evidence interpretation; `先补证据`\n- must_discover: original task domain, PDE solver evidence, architecture-to-physics interface, spectral or high-frequency signal support, code, benchmark, relation to PINN, DeepONet, FNO, Fourier PINN.\n- must_not_misjudge: do not treat name similarity or image-network structure as evidence of PDE suitability.\n- pass_signal: Judgment separates direct evidence, borrowable structure, and unsupported combination claims.\n\n### C3 - Medical Transformer risk prediction reuse\n\n- case_type: Stress Test\n- search_level: L3 deep review\n- tests: Research/Method Search; Vertical Business Process; data-fit judgment; evidence sufficiency\n- must_discover: task, data structure, time window, label definition, irregular time-series handling, structured and unstructured inputs, code, metrics, sample-size fit, reporting expectations.\n- must_not_misjudge: do not transfer large EHR Transformer papers directly to a 160-case ECMO task.\n- pass_signal: Judgment separates writing-structure reuse, model-module reuse, and non-reusable parts.\n\n### D1 - PDF-VLLM ICU nursing-record extraction improvement\n\n- case_type: Stress Test\n- search_level: L3 deep review\n- tests: Vertical Business Process; local/private evidence handling; source selection completeness; field-level claim decomposition\n- must_discover: medical table OCR, VLM table extraction, layout-aware OCR, human review, rule-based QC, privacy limits, local deployment needs, gap from existing PDF-VLLM workflow.\n- must_not_misjudge: do not treat generic OCR as a complete ICU nursing-record semantic extraction solution.\n- pass_signal: Evidence Pack separates layout extraction, semantic grouping, field validation, review workflow, and privacy deployment.\n\n### D2 - ECMO unstructured extraction and prediction\n\n- case_type: Stress Test\n- search_level: L3 deep review\n- tests: claim decomposition; research plus vertical source selection; privacy constraints; Judgment actionability\n- must_discover: clinical information extraction, temporal event extraction, medication dosage extraction, ICU/EHR risk prediction, medical LLM/SFT, small-sample modeling, annotation schema, privacy and ethics.\n- must_not_misjudge: do not collapse extraction and prediction into one LLM classification task.\n- pass_signal: Report builds an evidence chain from extraction to modeling instead of directly recommending LLM prediction.\n\n### D3 - Fluent blood-flow simulation automation\n\n- case_type: Real Exploration\n- search_level: L2 or L3\n- tests: vertical technical workflow; official docs plus scripts; implementation feasibility; operational risk recording\n- must_discover: Fluent journal, TUI, Python automation, boundary-condition import, mesh checks, batch solving, residual monitoring, parameter sweeps, adjacent medical-flow simulation examples.\n- must_not_misjudge: do not treat GUI tutorials as automation workflows.\n- pass_signal: Report separates scriptable steps, human-confirmation steps, and high-risk failure points.\n\n### E1 - Existing skill / agent workflow framework comparison\n\n- case_type: Meta-framework\n- search_level: L3 deep review\n- tests: framework prior-work search; method comparison; gap analysis; future roadmap design\n- must_discover: skill file structure, triggers, input and output contracts, allowed and prohibited behavior, verification checklist, examples, tests, routing, failure handling, safety boundary, maintenance model.\n- must_not_misjudge: do not copy execution-skill complexity into Prework Intelligence without a proven need.\n- pass_signal: Report compares others have, we have, we lack, worth adding, and timing.\n\n### E2 - Existing-work-search method prior work\n\n- case_type: Meta-framework\n- search_level: L3 deep review\n- tests: meta-method search; source-class expansion; scoring-rule revision; Judgment glossary revision\n- must_discover: prior art search, systematic or scoping review, technology scouting, build-vs-buy frameworks, evidence grading, competitive intelligence, absence-of-evidence handling, decision matrix methods.\n- must_not_misjudge: do not treat one source-class method as a full replacement for Prework Intelligence.\n- pass_signal: Judgment identifies which mature frameworks should influence V1.1 or V2 and which should remain out of scope.\n\n## Current Next Step\n\nUse A1 as the first calibration review. Do not start E1 or B1 until A1 evaluation and V1.1 regression are reviewed.\n"

le stop, such as source coverage, timebox, entity count, or discovery of a strong substitute.\n\n## Negative Search Scope\n\nState which failure cases, complaints, limitations, abandoned projects, or alternatives should be searched.\n\n## Evidence Pack Handoff Checklist\n\n- Query log records what was searched.\n- Results are grouped by entity.\n- Every entity has `entity_id`.\n- Every entity has `relevance_score`, `reuse_score`, `method_similarity`, `method_note`, `source_grade`, and `evidence_status`.\n- Capability Claim Matrix records `claim_id`, `surface_scope`, `lifecycle_scope`, `freshness_status`, supporting records, and gaps.\n- Information gaps are explicit.\n- No final judgment is included.\n"

    "raw": "# Evidence Pack\n\nThis is the only handoff artifact from Search Module to Judgment Module. It records evidence, not final decisions.\n\n## Case Metadata\n\n- Case ID:\n- Idea title:\n- Original idea:\n- Search level:\n- Search date:\n- Searcher:\n\n## Coverage Summary\n\n- Searched source classes:\n- Unsearched source classes:\n- Languages searched:\n- Timebox:\n- Coverage note:\n\n## Query Log\n\n| query_id | source_class | source_name | query | result_count | kept_entities | notes |\n| --- | --- | --- | --- | ---: | --- | --- |\n| Q001 |  |  |  |  |  |  |\n\n## Capability Claim Matrix\n\nUse this matrix to separate broad cases into claim-level evidence records. It does not contain final Judgment conclusions.\n\nAllowed `surface_scope` values: `desktop_app`, `vscode_extension`, `cli`, `app_server`, `web_product`, `remote_thread`, `local_state`, `cross_surface`, `unknown`.\n\nAllowed `lifecycle_scope` values: `thread_start`, `manual_rename`, `auto_title_generation`, `thread_list`, `thread_read`, `thread_resume`, `thread_fork`, `legacy_thread`, `batch_review`, `archive_unarchive`, `not_applicable`, `unknown`.\n\nAllowed `freshness_status` values: `current_official`, `current_observed`, `recent_but_unverified`, `stale_issue`, `conflicting`, `unknown_date`.\n\nUse the same values for `claim_evidence_status` as `evidence_status`: `confirmed`, `single-source`, `conflicting`, or `unverified`.\n\n| claim_id | claim | surface_scope | lifecycle_scope | freshness_status | supporting_entities | supporting_negative_evidence | claim_evidence_status | gaps |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| C001 |  |  |  |  |  |  |  |  |\n\n## Entity Records\n\nCreate one record per entity, not one record per URL.\n\n### Entity E001\n\n- entity_id: E001\n- entity_name:\n- entity_type:\n- core_function:\n- relevance_score:\n- reuse_score:\n- score_scope:\n- method_similarity:\n- method_note:\n- source_grade:\n- evidence_status:\n\n#### Main Source\n\n- title:\n- url_or_local_reference:\n- accessed_at:\n- source_grade:\n- source_excerpt_or_summary:\n\n#### Support Sources\n\n| title | url_or_local_reference | accessed_at | source_grade | supports_which_claim |\n| --- | --- | --- | --- | --- |\n|  |  |  |  |  |\n\n#### Key Facts\n\nRecord facts that are directly supported by the listed sources.\n\n#### Similarity Notes\n\n- Problem similarity:\n- User similarity:\n- Input similarity:\n- Output similarity:\n- Workflow similarity:\n- Constraint similarity:\n\n#### Reuse Notes\n\n- Reusable parts:\n- Integration cost:\n- License or terms:\n- Maintenance signal:\n\n#### Gaps\n\n- Record missing facts needed for judgment.\n\n#### Risks\n\n- Record reliability, fit, compliance, maintenance, or implementation risks.\n\n## Information Gaps\n\nList missing evidence that may affect judgment.\n\n## Negative Evidence Records\n\nRecord negative evidence as searched absence within a defined scope.\n\nNegative Evidence can only mean strong evidence was not found within the covered source classes, queries, and limits. It must not be used to claim absolute non-existence.\n\n### Negative Evidence N001\n\n- negative_evidence_id: N001\n- searched_claim:\n- searched_source_classes:\n- searched_queries:\n- result:\n- interpretation_limit:\n\n## Negative Search Scope\n\nRecord searched failure cases, complaints, limitations, abandoned projects, and alternative approaches. If not searched, say which source classes remain unsearched.\n\n## Search Module Notes\n\nWrite search limitations and uncertainty. Do not include final recommendations.\n"

    "path": "templates/judgment-report.md",
    "title": "Judgment Report",
    "group": "Templates",
    "raw": "# Judgment Report\n\nThis report is written by the Judgment Module after reading one Evidence Pack. It must not introduce new evidence.\n\n## Evidence Pack Used\n\n- Case ID:\n- Evidence Pack path:\n- Evidence Pack addendum paths, or `none`:\n- Evidence Pack date:\n\nIf addenda are listed, the base pack plus addenda form one Evidence Pack bundle for this Judgment Report. Do not cite records outside that declared bundle.\n\n## Primary Conclusion\n\nChoose exactly one:\n\n- `放弃不做`\n- `直接采用`\n- `接入改造`\n- `场景定制`\n- `补齐缺口`\n- `自研小样`\n- `先补证据`\n\n## Conclusion Glossary\n\n- `放弃不做`: Existing evidence shows the work is not worth pursuing now.\n- `直接采用`: A sufficiently fitting existing solution can be used as-is.\n- `接入改造`: Existing work can cover the base need if integrated, wrapped, or lightly adapted.\n- `场景定制`: A general solution exists, but the user's domain needs a focused variant.\n- `补齐缺口`: Prior work covers the foundation, and the main value is finishing missing workflow, UX, or operational pieces.\n- `自研小样`: No suitable reusable base is evident, so a small in-house prototype is justified.\n- `先补证据`: The Evidence Pack is not sufficient for a responsible judgment.\n\n## Required Evidence Citations\n\nEvery conclusion in this report must cite Evidence Pack `entity_id` values such as `E001` or `E002`, or `negative_evidence_id` values such as `N001`.\n\nThe report is invalid if the primary conclusion does not cite at least one `entity_id` or `negative_evidence_id`, except `先补证据` may cite `none` when the Evidence Pack contains no relevant evidence record.\n\nWhen `先补证据` cites `none`, the report must explain which evidence record is missing: entity record, source record, negative evidence record, or method comparison note.\n\nClaim-level local conclusions must also cite `entity_id` or `negative_evidence_id` values. A claim-level `先补证据` may cite `none` only when the missing claim has no relevant evidence record, and must name the missing surface, lifecycle, freshness, or source record.\n\nNegative evidence means strong evidence was not found within the recorded source coverage. It must not be interpreted as proof that no solution, product, method, or prior work exists.\n\n## Judgment Rule Table\n\nThese are rough judgment rules, not a full decision formula.\n\n- Coverage is insufficient or a key source class is unsearched: `先补证据`\n- High relevance and high reuse: `直接采用` / `接入改造`\n- High relevance and low reuse: `补齐缺口` / `场景定制`\n- One entity is insufficient, but multiple entities together cover the need: `接入改造` / `补齐缺口`\n- No strong substitute and negative evidence coverage is sufficient: `自研小样`\n- Strong substitute exists and the remaining difference is not important: `放弃不做`\n\n## Conclusion Rationale\n\n- Primary conclusion:\n- Cited entity_id or negative_evidence_id values:\n- Why these evidence records support the conclusion:\n- Important evidence gaps:\n\n## Claim Matrix\n\nUse this table when the Evidence Pack contains a Capability Claim Matrix. Local conclusions do not replace the Primary Conclusion.\n\n| claim_id | claim | surface_scope | lifecycle_scope | freshness_status | local_conclusion | cited_records | rationale | remaining_gap |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| C001 |  |  |  |  |  |  |  |  |\n\n## Most Relevant Entities\n\n| entity_id | entity_name | relevance_score | reuse_score | source_grade | evidence_status | role in judgment |\n| --- | --- | ---: | ---: | --- | --- | --- |\n| E001 |  |  |  |  |  |  |\n\n## Why Existing Work Does Or Does Not Substitute\n\nExplain the substitute strength of cited entities only. Do not reference uncited sources.\n\n## What To Reuse\n\nList reusable code, workflow, data model, interface, method, product pattern, or operational process from cited entities.\n\n## What Not To Do\n\nList work that the evidence suggests avoiding. Cite `entity_id` or `negative_evidence_id` values for each claim.\n\n## Negative Evidence Used\n\n| negative_evidence_id | searched_scope | source_classes_covered | judgment use | limits |\n| --- | --- | --- | --- | --- |\n| N001 |  |  |  |  |\n\n## Next Action\n\nState one next action that follows from the primary conclusion.\n\n## Supplement-Evidence Request\n\nUse this section only when the primary conclusion is `先补证据`.\n\n- Affected entity_id values or `none`:\n- Affected negative_evidence_id values or `none`:\n- Missing source class:\n- Missing claim or comparison:\n- Missing evidence record type:\n- Why judgment cannot proceed:\n- What the Search Module should add to a revised Evidence Pack:\n\n## Validity Checklist\n\n- The report reads only the Evidence Pack.\n- The primary conclusion is one of the allowed values.\n- The primary conclusion cites `entity_id` or `negative_evidence_id` values, or `none` for a justified supplement-evidence request.\n- Every claim-level local conclusion cites `entity_id` or `negative_evidence_id` values, or justified `none` for `先补证据`.\n- No new sources, URLs, or entities are introduced.\n- Negative evidence is interpreted only as no strong evidence found within covered sources.\n- Evidence gaps are not converted into confident claims.\n"

    "path": "strategy-cards/github-implementation-search.md",
    "title": "GitHub Implementation Search",
    "group": "Strategy Cards",
    "raw": "# GitHub Implementation Search\n\n## Purpose\n\nThis strategy card serves only the Search Module.\n\nIts purpose is to discover whether an idea, tool need, or feature has an existing open-source implementation or reusable code base.\n\nIt searches for repositories, libraries, plugins, scripts, CLIs, extensions, issues, and discussions that implement or approximate the target capability.\n\nIt does not produce Judgment conclusions.\n\n## When To Use\n\nUse this card when the idea is primarily about:\n\n- software/tooling;\n- developer workflow;\n- automation script;\n- plugin/extension;\n- library/package;\n- internal tool replacement.\n\n## Inputs\n\nUse available inputs from:\n\n- Idea Card;\n- Search Plan;\n- query matrix;\n- known names;\n- known technologies;\n- known programming languages;\n- constraints such as local-only operation, license, maintenance, platform, runtime, deployment target, or integration environment.\n\n## Source Classes\n\nUse the relevant source classes below:\n\n- GitHub repository search;\n- GitHub code search;\n- GitHub issues/discussions;\n- package registries when relevant;\n- official docs when a project is found.\n\n## Query Templates\n\nUse templates and fill them from the Idea Card and query matrix. Do not hard-code a case-specific query.\n\n### GitHub Native Search Templates\n\nExact name search:\n\n```text\n\"<exact name>\"\n\"<exact name>\" github\n\"<exact name>\" tool\n```\n\nFunction description search:\n\n```text\n\"<function description>\" github\n\"<function description>\" tool\n\"<function description>\" open source\n```\n\nSynonym / alternative naming search:\n\n```text\n\"<synonym term>\" \"<object term>\"\n\"<alternative name>\" github\n\"<problem term>\" \"<solution term>\"\n```\n\nCode symbol / config / CLI search:\n\n```text\n\"<symbol_or_function_name>\" language:<language>\n\"<config_key>\" \"<tool category>\"\n\"<cli_command_or_flag>\" github\n```\n\n### Web Search Constrained To GitHub Templates\n\nREADME search:\n\n```text\nsite:github.com \"<function description>\" \"README\"\nsite:github.com \"<object term>\" \"<method term>\"\nsite:github.com \"<tool category>\" \"<expected output>\"\n```\n\nIssue / pain-point search:\n\n```text\nsite:github.com \"<problem term>\" \"issue\"\nsite:github.com \"<pain point>\" \"feature request\"\nsite:github.com \"<tool category>\" \"discussion\"\n```\n\nAbandoned / limitation search:\n\n```text\n\"<project or function term>\" \"not maintained\"\n\"<project or function term>\" \"deprecated\"\n\"<project or function term>\" \"does not support\"\n\"<project or function term>\" \"limitation\"\n\"<project or function term>\" \"alternative\"\n```\n\n## Execution Steps\n\n1. Start with exact-name queries from known project, feature, package, plugin, or CLI names.\n2. Search function terms from the goal, input, output, and object fields.\n3. Search synonym and alternative naming terms from the query matrix.\n4. Search code-level terms, including symbols, config keys, CLI flags, package names, and language-specific terms when available.\n5. Search issue and pain terms to find feature requests, limitations, workarounds, and failed implementations.\n6. Record every executed query in the Evidence Pack query log.\n7. Screen candidate results for fit, maintenance, license, usability, and implementation depth.\n8. Aggregate the same project's repository, docs, issues, discussions, and packages into one entity.\n\n## Evidence To Record\n\nFor every retained entity, record at least:\n\n- entity_name;\n- repo or primary source;\n- core_function;\n- supported features;\n- missing features;\n- license or terms if available;\n- maintenance signal;\n- integration signal;\n- relevant issues or discussions;\n- relevance_score;\n- reuse_score;\n- method_similarity;\n- method_note;\n- source_grade;\n- evidence_status.\n\n## Entity Aggregation Rules\n\nAggregate by project entity, not URL.\n\nFor the same project, combine:\n\n- GitHub repository;\n- official docs;\n- package registry page;\n- release notes;\n- issues;\n- discussions.\n\nDistinguish:\n\n- original project from forks;\n- mirror from upstream;\n- template from working implementation;\n- demo from maintained project.\n\nIf a wrapper project depends on an upstream project, record both the wrapper and upstream relationship in the entity notes.\n\n## Negative / Failure Searches\n\nRun negative and failure-oriented queries when a candidate looks relevant or when no strong candidate appears.\n\nInclude terms such as:\n\n- `not maintained`;\n- `deprecated`;\n- `does not support`;\n- `alternative`;\n- `issue`;\n- `limitation`;\n- `abandoned`;\n- `feature request`.\n\nRecord these as information gaps or Negative Evidence Records. Negative evidence means no strong evidence was found within the covered scope; it does not prove non-existence.\n\n## Stopping Rules\n\nL1 can stop when exact-name, function-description, and basic GitHub repository searches either find a clear candidate or produce a recorded negative scope.\n\nL2 can stop when repository search, code search, issues/discussions, and relevant package registry checks have been performed for the main query families.\n\nL3 can stop when close candidates have also been checked for license, maintenance, docs, issues, releases, forks/mirrors, and upstream dependencies.\n\nIf a high-relevance and high-reuse project is found, still check license, maintenance, docs, and issues before handoff.\n\nIf no result is found, record the negative evidence scope. Do not say the implementation does not exist.\n\n## Common False Positives\n\nCommon false positives include:\n\n- same name but different function;\n- toy demo;\n- abandoned repository;\n- README overstates capability;\n- fork or mirror duplicate;\n- research code that is not reusable engineering;\n- license blocks reuse;\n- project solves only a subproblem, not the full need.\n\n## Handoff To Evidence Pack\n\nAll retained results must be written into the Evidence Pack.\n\nThis strategy card must not output Judgment conclusions such as `放弃不做`, `直接采用`, `接入改造`, `场景定制`, `补齐缺口`, `自研小样`, or `先补证据`.\n\nIf evidence is insufficient, record information gaps and Negative Evidence Records only.\n"
  },

    "path": "strategy-cards/negative-evidence-search.md",
    "title": "Negative Evidence Search",
    "group": "Strategy Cards",
    "raw": "# Negative Evidence Search\n\n## Purpose\n\nThis strategy card serves only the Search Module.\n\nIts purpose is to record searched absence within a defined scope.\n\nNegative evidence can only mean that strong evidence was not found within the covered sources, queries, timebox, and limits. It must not be used to claim absolute non-existence.\n\nThis card does not produce Judgment conclusions.\n\n## When To Use\n\nUse this card when:\n\n- strong similar solutions are not found;\n- the search needs to check whether there is no obvious open-source implementation, product, paper, or substitute;\n- high-relevance entities have insufficient evidence;\n- the search needs to check `abandoned`, `deprecated`, `limitation`, `does not support`, `alternative`, `complaint`, or failure-case signals;\n- the Judgment Module may need to cite `negative_evidence_id`.\n\n## Inputs\n\nUse available inputs from:\n\n- Idea Card;\n- Search Plan;\n- Query Matrix;\n- Source Selection rules;\n- executed query log;\n- discovered entities;\n- information gaps.\n\n## Source Classes\n\nNegative evidence can come from different source classes:\n\n- general web;\n- GitHub / open source;\n- product directories;\n- papers;\n- communities / issues / forums;\n- patents / standards;\n- user-provided or local sources when allowed.\n\nDo not turn this into a platform adapter plan or crawler plan.\n\n## Query Templates\n\nUse templates and fill them from the Idea Card, Search Plan, and query matrix. Do not hard-code a case-specific query.\n\nExact-name absence search:\n\n```text\n\"<exact name>\"\n\"<exact name>\" \"<source class term>\"\n\"<exact name>\" \"<known platform or ecosystem>\"\n```\n\nFunction + alternative search:\n\n```text\n\"<function description>\" alternative\n\"<function description>\" substitute\n\"<function description>\" similar tool\n```\n\nLimitation search:\n\n```text\n\"<entity or function term>\" limitation\n\"<entity or function term>\" limitations\n\"<entity or function term>\" missing feature\n```\n\nAbandoned / deprecated search:\n\n```text\n\"<entity or function term>\" abandoned\n\"<entity or function term>\" deprecated\n\"<entity or function term>\" no longer maintained\n```\n\nComplaint / issue search:\n\n```text\n\"<problem term>\" complaint\n\"<problem term>\" issue\n\"<problem term>\" not working\n```\n\nCompetitor / alternative search:\n\n```text\n\"<tool or method term>\" competitor\n\"<tool or method term>\" alternative\n\"<tool or method term>\" vs\n```\n\nFailure case search:\n\n```text\n\"<method or tool term>\" failure\n\"<method or tool term>\" failed\n\"<method or tool term>\" does not work\n```\n\nDoes-not-support search:\n\n```text\n\"<entity or function term>\" \"does not support\"\n\"<entity or function term>\" \"not supported\"\n\"<entity or function term>\" \"unsupported\"\n```\n\nNo open source / closed source only search:\n\n```text\n\"<function description>\" \"no open source\"\n\"<function description>\" \"closed source\"\n\"<function description>\" \"proprietary\"\n```\n\nNot maintained search:\n\n```text\n\"<entity or function term>\" \"not maintained\"\n\"<entity or function term>\" \"maintenance mode\"\n\"<entity or function term>\" \"archived\"\n```\n\n## Execution Steps\n\n1. Confirm that positive search has already been executed for the relevant source classes.\n2. Define the `searched_claim` being tested.\n3. Run negative, limitation, failure, and alternative queries by source class.\n4. Record every query in the Evidence Pack query log.\n5. Distinguish `no result`, `weakly related results`, and `results exist but do not form a strong substitute`.\n6. Write findings into Negative Evidence Records.\n7. Do not write negative evidence as an absolute conclusion.\n\n## Evidence To Record\n\nEach Negative Evidence Record must record at least:\n\n- negative_evidence_id;\n- searched_claim;\n- searched_source_classes;\n- searched_queries;\n- result;\n- interpretation_limit.\n\nThe `result` should state one of these patterns when applicable:\n\n- no strong result found;\n- only weakly related results found;\n- only stale / abandoned results found;\n- only partial substitutes found;\n- source class unsearched.\n\n## Entity Aggregation Rules\n\nNegative evidence is not aggregated as an entity.\n\nIf a weakly related object is found, create an entity record first and describe its weakness in gaps or risks.\n\nIf no entity can be formed from the covered search scope, record a Negative Evidence Record instead.\n\nDo not reuse an `entity_id` as a `negative_evidence_id`.\n\n## Interpretation Limits\n\nNegative evidence never proves non-existence.\n\nIt only limits what was not found within recorded coverage.\n\nNarrow coverage should create information gaps, not confident conclusions.\n\nA negative record from one source class cannot stand for all source classes.\n\n## Relationship To Entity Records\n\n`negative_evidence_id` is not an `entity_id`.\n\nIf a weakly related object is found, create an entity record first and describe its weaknesses in gaps or risks.\n\nIf no entity can be formed, record negative evidence.\n\nAn Evidence Pack can contain both entity records and negative evidence records.\n\n## Negative / Failure Searches\n\nUse the query families above to search for absence, limitations, abandoned work, deprecated work, complaints, alternatives, and failure cases within recorded source classes.\n\nRecord the searched scope and result in Negative Evidence Records.\n\nDo not convert a negative or failure search into a claim that no solution exists.\n\n## Stopping Rules\n\nL1 can stop when the main source classes have been searched and no obvious strong substitute appears; record preliminary negative evidence.\n\nL2 can stop when required source classes have been searched and the main query families are covered; record standard negative evidence.\n\nL3 can stop when multiple source classes have been checked, including failure, alternative, limitation, and stale-project searches; record stronger negative evidence.\n\nIf a required source class is unsearched, coverage cannot be marked sufficient.\n\n## Common False Positives\n\nCommon false positives include:\n\n- query terms are too narrow;\n- only Chinese or only English was searched;\n- only exact names were searched;\n- platform content is not indexed by general search engines;\n- private, closed-source, or internal tools are not visible;\n- similar solutions use completely different names;\n- only homepage snippets were read;\n- no open source is misread as no one has done it.\n\n## Handoff To Evidence Pack\n\nAll outputs from this card must be written into the Evidence Pack's Negative Evidence Records.\n\nThis strategy card must not output Judgment conclusions such as `放弃不做`, `直接采用`, `接入改造`, `场景定制`, `补齐缺口`, `自研小样`, or `先补证据`.\n\nIf negative evidence scope is too narrow, record information gaps only.\n"
  },

    "path": "strategy-cards/product-competitor-search.md",
    "title": "Product Competitor Search",
    "group": "Strategy Cards",
    "raw": "# Product Competitor Search\n\n## Purpose\n\nThis strategy card serves only the Search Module.\n\nIts purpose is to find existing products, commercial tools, hosted services, apps, plugins, and workflow substitutes that may solve the same user problem as the idea.\n\nIt does not produce Judgment conclusions, market reports, business plans, or product strategy.\n\nAll retained results must be recorded in the Evidence Pack.\n\n## When To Use\n\nUse this card when the idea may already be covered by:\n\n- a commercial product;\n- a SaaS workflow;\n- a desktop or mobile app;\n- a browser extension or marketplace app;\n- a vertical industry tool;\n- a no-code or low-code service;\n- an internal-tool replacement with available public substitutes.\n\n## Inputs\n\nUse available inputs from:\n\n- Idea Card;\n- Search Plan;\n- query matrix;\n- target user or buyer;\n- workflow steps;\n- known product names;\n- platform constraints;\n- pricing, deployment, privacy, integration, or compliance constraints.\n\n## Source Classes\n\nUse relevant source classes below:\n\n- general web search;\n- product homepages;\n- product directories;\n- app stores or extension marketplaces;\n- review and comparison pages;\n- pricing pages and terms pages;\n- help docs, changelogs, and integration docs;\n- user communities, forums, and issue-like complaint sources.\n\nDo not turn this source list into a crawler, platform adapter, or market database plan.\n\n## Query Templates\n\nUse templates and fill them from the Idea Card and query matrix. Do not hard-code a case-specific query.\n\nExact product or category search:\n\n```text\n\"<exact product name>\"\n\"<tool category>\" \"<target user>\"\n\"<workflow name>\" software\n```\n\nFunction and outcome search:\n\n```text\n\"<function description>\" tool\n\"<desired output>\" software\n\"<input object>\" \"<desired action>\" app\n```\n\nCompetitor and alternative search:\n\n```text\n\"<known product>\" alternative\n\"<known product>\" competitor\n\"<tool category>\" comparison\n```\n\nDirectory and marketplace search:\n\n```text\n\"<tool category>\" product directory\n\"<tool category>\" marketplace\n\"<platform>\" \"<extension or app category>\"\n```\n\nPricing, terms, and integration search:\n\n```text\n\"<product name>\" pricing\n\"<product name>\" API\n\"<product name>\" integration\n\"<product name>\" terms\n```\n\nUser pain and limitation search:\n\n```text\n\"<product name>\" limitation\n\"<product name>\" complaint\n\"<product name>\" does not support\n\"<workflow problem>\" workaround\n```\n\n## Execution Steps\n\n1. Start with known product names and exact category terms.\n2. Search function, outcome, input, and workflow terms.\n3. Search competitor, alternative, comparison, and directory terms.\n4. For close candidates, inspect product pages, docs, pricing or terms, integrations, and user-facing evidence.\n5. Search limitation, complaint, and workaround terms for close candidates.\n6. Record every executed query in the Evidence Pack query log.\n7. Screen candidates for problem fit, target user fit, workflow coverage, integration, cost, terms, and operational limits.\n8. Aggregate the same product's homepage, docs, pricing, reviews, marketplace listing, and community evidence into one entity.\n\n## Evidence To Record\n\nFor every retained entity, record at least:\n\n- entity_name;\n- product or primary source;\n- core_function;\n- target user;\n- supported workflow steps;\n- missing workflow steps;\n- pricing or access model when available;\n- license, terms, privacy, or deployment constraints when available;\n- integration signal;\n- maintenance or product activity signal;\n- relevant reviews, complaints, or comparisons;\n- relevance_score;\n- reuse_score;\n- method_similarity;\n- method_note;\n- source_grade;\n- evidence_status.\n\n## Entity Aggregation Rules\n\nAggregate by product entity, not URL.\n\nFor the same product, combine:\n\n- official homepage;\n- official docs;\n- pricing or terms pages;\n- marketplace or app-store listing;\n- changelog or release notes;\n- review pages;\n- user community or complaint sources.\n\nDistinguish:\n\n- direct competitor from indirect substitute;\n- product from marketplace wrapper;\n- product family from individual module;\n- official page from reseller or affiliate listing;\n- current product from discontinued product.\n\nIf one product depends on another platform or upstream service, record that relationship in entity notes.\n\n## Negative / Failure Searches\n\nRun negative and failure-oriented queries when no strong substitute appears or when a candidate appears close.\n\nInclude terms such as:\n\n- `alternative`;\n- `competitor`;\n- `limitation`;\n- `complaint`;\n- `does not support`;\n- `missing feature`;\n- `deprecated`;\n- `discontinued`;\n- `pricing`;\n- `terms`;\n- `integration`.\n\nRecord these as information gaps or Negative Evidence Records. Negative evidence means no strong evidence was found within the covered scope; it does not prove non-existence.\n\n## Stopping Rules\n\nL1 can stop when general web, product homepage or directory, and obvious alternative queries either find clear candidates or produce a recorded negative scope.\n\nL2 can stop when product homepages, product directories, review or comparison sources, and at least one user-facing source class have been searched for the main query families.\n\nL3 can stop when close candidates have also been checked for docs, pricing or terms, integrations, changelogs, multiple user communities, and limitation or complaint evidence.\n\nIf only vendor pages were searched, source coverage is not sufficient for product substitute claims.\n\nIf no result is found, record the negative evidence scope. Do not say the product or competitor does not exist.\n\n## Common False Positives\n\nCommon false positives include:\n\n- same category name but different user problem;\n- marketing page claims unsupported by docs or user evidence;\n- generic platform that needs too much custom build;\n- product covers only one workflow step;\n- discontinued or renamed product;\n- reseller, affiliate, or SEO listing mistaken for an official source;\n- pricing or terms block reuse;\n- product exists but lacks required integration or deployment mode.\n\n## Handoff To Evidence Pack\n\nAll retained results must be written into the Evidence Pack.\n\nThis strategy card must not output Judgment conclusions such as `放弃不做`, `直接采用`, `接入改造`, `场景定制`, `补齐缺口`, `自研小样`, or `先补证据`.\n\nIf evidence is insufficient, record information gaps and Negative Evidence Records only.\n"
  },
