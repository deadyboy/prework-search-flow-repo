    "path": "strategy-cards/paper-prior-work-search.md",
    "title": "Paper Prior Work Search",
    "group": "Strategy Cards",
    "raw": "# Paper Prior Work Search\n\n## Purpose\n\nThis strategy card serves only the Search Module.\n\nIts purpose is to find academic prior work, research methods, surveys, benchmarks, datasets, research prototypes, and paper-with-code style implementations that may already cover the idea or a core method.\n\nIt does not produce Judgment conclusions or a full literature review.\n\nAll retained results must be recorded in the Evidence Pack.\n\n## When To Use\n\nUse this card when the idea depends on:\n\n- a research method;\n- a model, algorithm, or technical approach;\n- benchmark or dataset precedent;\n- paper claims about feasibility or performance;\n- academic prototypes;\n- comparison against published prior work;\n- same method with a different goal;\n- same goal with a different method.\n\n## Inputs\n\nUse available inputs from:\n\n- Idea Card;\n- Search Plan;\n- query matrix;\n- method terms;\n- task, input, output, and domain terms;\n- known papers, authors, labs, datasets, or benchmarks;\n- constraints such as reproducibility, code availability, data access, license, compute, and deployment fit.\n\n## Source Classes\n\nUse relevant source classes below:\n\n- academic search indexes;\n- preprint servers;\n- publisher pages;\n- survey and review papers;\n- benchmark and dataset pages;\n- paper-with-code or implementation listings;\n- official project pages;\n- associated GitHub repositories when relevant;\n- citation trails from close papers.\n\nDo not turn this source list into an API adapter, crawler, or automated review pipeline.\n\n## Query Templates\n\nUse templates and fill them from the Idea Card and query matrix. Do not hard-code a case-specific query.\n\nTask and method search:\n\n```text\n\"<task term>\" \"<method term>\"\n\"<input object>\" \"<output object>\" \"<method term>\"\n\"<domain term>\" \"<technical approach>\"\n```\n\nSurvey and review search:\n\n```text\n\"<task term>\" survey\n\"<method family>\" review\n\"<domain term>\" systematic review\n```\n\nBenchmark and dataset search:\n\n```text\n\"<task term>\" benchmark\n\"<task term>\" dataset\n\"<method term>\" leaderboard\n```\n\nPaper-with-code and implementation search:\n\n```text\n\"<paper or method term>\" code\n\"<task term>\" \"paper with code\"\n\"<method term>\" github\n```\n\nSynonym and alternate framing search:\n\n```text\n\"<synonym task term>\" \"<method term>\"\n\"<alternate method name>\" \"<domain term>\"\n\"<problem framing>\" \"<research term>\"\n```\n\nLimitation and failure search:\n\n```text\n\"<method term>\" limitation\n\"<method term>\" failure\n\"<task term>\" challenge\n\"<dataset or benchmark>\" bias\n```\n\n## Execution Steps\n\n1. Start with task and method terms from the Idea Card.\n2. Search survey or review terms to identify established terminology and major branches.\n3. Search recent, highly cited, and closely matching papers.\n4. Search benchmark, dataset, and leaderboard terms when the idea depends on measurable performance.\n5. Search for associated code, project pages, reproducibility notes, and implementation listings.\n6. Follow citations backward and forward for close papers when the search level requires it.\n7. Record every executed query in the Evidence Pack query log.\n8. Screen candidates for task fit, method similarity, evidence strength, reproducibility, code or data availability, and operational relevance.\n9. Aggregate one paper, its project page, code, dataset links, and benchmark entries into one entity when they describe the same research work.\n\n## Evidence To Record\n\nFor every retained entity, record at least:\n\n- entity_name;\n- paper title or primary source;\n- authors or organization when relevant;\n- publication venue or source class;\n- year or version;\n- core_method;\n- task and domain;\n- input and output;\n- supported claims;\n- benchmark or dataset evidence when available;\n- code, data, or project availability when available;\n- reproducibility signal;\n- practical reuse constraints;\n- relevance_score;\n- reuse_score;\n- method_similarity;\n- method_note;\n- source_grade;\n- evidence_status.\n\n## Entity Aggregation Rules\n\nAggregate by research work or method entity, not URL.\n\nFor the same research work, combine:\n\n- paper page;\n- preprint page;\n- publisher page;\n- official project page;\n- code repository;\n- dataset or benchmark page;\n- errata, follow-up note, or reproducibility report.\n\nDistinguish:\n\n- survey paper from original method paper;\n- benchmark from method;\n- dataset from model or algorithm;\n- paper claim from working implementation;\n- research prototype from production-ready tool;\n- follow-up paper from the original work.\n\nIf a paper builds on a prior method or dataset, record that relationship in entity notes.\n\n## Negative / Failure Searches\n\nRun negative and failure-oriented queries when no close prior work appears or when a candidate appears close.\n\nInclude terms such as:\n\n- `survey`;\n- `review`;\n- `benchmark`;\n- `dataset`;\n- `limitation`;\n- `failure`;\n- `challenge`;\n- `reproducibility`;\n- `no code`;\n- `ablation`;\n- `baseline`;\n- `comparison`.\n\nRecord these as information gaps or Negative Evidence Records. Negative evidence means no strong evidence was found within the covered scope; it does not prove non-existence.\n\n## Stopping Rules\n\nL1 can stop when an academic index or preprint source and general web search either find obvious close papers or produce a recorded negative scope.\n\nL2 can stop when academic indexes, surveys or reviews, recent or highly cited papers, and implementation or dataset sources have been searched for the main query families.\n\nL3 can stop when close papers have also been checked through backward citations, forward citations, benchmark or dataset evidence, code availability, and limitation or reproducibility searches.\n\nIf no academic index was searched, source coverage is not sufficient for prior-work claims.\n\nIf no result is found, record the negative evidence scope. Do not say the prior work does not exist.\n\n## Common False Positives\n\nCommon false positives include:\n\n- similar title but different task;\n- same task but different method;\n- same method but different goal;\n- paper only proposes a concept without implementation;\n- benchmark result does not match the user's constraints;\n- dataset is not available or not reusable;\n- code exists but is incomplete, stale, or non-reproducible;\n- survey mentions an area but not the specific workflow;\n- abstract claims are stronger than the method or experiments support.\n\n## Handoff To Evidence Pack\n\nAll retained results must be written into the Evidence Pack.\n\nThis strategy card must not output Judgment conclusions such as `放弃不做`, `直接采用`, `接入改造`, `场景定制`, `补齐缺口`, `自研小样`, or `先补证据`.\n\nIf evidence is insufficient, record information gaps and Negative Evidence Records only.\n"
  },

    "raw": "# Strategy Cards Review\n\n## Purpose\n\nThis review checks the current strategy cards for consistency before the workflow reaches the first hard stop.\n\nIt is a review artifact, not a new Search Module source strategy and not a Judgment Module artifact.\n\n## Scope\n\nReviewed files:\n\n- `github-implementation-search.md`\n- `negative-evidence-search.md`\n- `product-competitor-search.md`\n- `paper-prior-work-search.md`\n- `README.md`\n\n## Checks\n\nThe review checked whether each strategy card:\n\n- serves only the Search Module;\n- includes the README-required sections;\n- hands off retained results only through the Evidence Pack;\n- avoids producing Judgment conclusions;\n- records negative evidence as scoped absence, not proof of non-existence;\n- keeps entity aggregation separate from URL aggregation;\n- avoids crawler, adapter, RAG, agent, reranker, automation, and case-run instructions.\n\n## Findings\n\nAll source strategy cards state that they serve only the Search Module.\n\nAll source strategy cards include the README-required structure after the Phase 2e cleanup.\n\nAll source strategy cards hand off retained results through the Evidence Pack and use Negative Evidence Records only for scoped absence.\n\nAll source strategy cards explicitly forbid outputting Judgment conclusions.\n\nNo strategy card requires code, crawlers, agents, RAG, rerankers, platform adapters, automation, or real case execution.\n\n## Cleanup Applied\n\n`negative-evidence-search.md` was missing the README-required `Entity Aggregation Rules` heading.\n\nThe cleanup added a short section clarifying that negative evidence is not aggregated as an entity, and that weakly related objects should become entity records before negative evidence is used.\n\n## Remaining Limits\n\nThis review checks documentation consistency only.\n\nIt does not validate whether the strategy cards produce good Evidence Packs in real cases.\n\nThat validation requires Phase 3 or later case work, which is a hard stop.\n\n## Result\n\nThe strategy-card set is ready for user review before Phase 3.\n"

    "raw": "# Case Retrospective\n\n## 哪些字段本案例确实需要？\n\n- `method_similarity` 和 `method_note` 有用。它们把“API 层能改 thread name”和“完整 sidebar governance workflow”区分开了。\n- `reuse_score` 有用。它能区分官方 API、风险较高的 patcher、以及只能借鉴模式的相邻产品。\n- `negative_evidence_id` 有用。这个案例需要记录：在官方文档和公开产品/开源来源中，没有找到完整安全流程。\n- `gaps` 和 `risks` 必要。具体 surface 是否可用、本地状态是否安全、patcher 是否可复用，这些都不能省略。\n\n## 哪些搜索源最有用？\n\n- 官方 Codex app-server docs 最有用，因为它给出了最强的可复用基础。\n- Codex changelog 和 configuration docs 是有价值的支撑来源，能证明 thread rename 不是孤立概念。\n- `openai/codex` GitHub issues 很有用，能看到用户痛点、缺失 surface 和近期 feature request。\n- 目的很明确的 open-source patcher 有用。它提供了实现模式，也暴露了安全风险。\n\n## 哪些搜索源浪费时间或未能覆盖？\n\n- 泛产品搜索大多只找到相邻 AI chat managers，不是 Codex-specific title governance。\n- ChatGPT Help Center 只能提供相邻产品模式，不能直接证明 Codex 支持。\n- academic paper search 对本案例帮助不大，所以没有执行。\n- 本地 Codex state 没有检查。这是有意的，因为它可能涉及私人 thread data，而且第一次公开来源案例不需要它。\n\n## 评分是否稳定，哪里不稳定？\n\n- `relevance_score` 对官方 API 和公开 issue 比较稳定。\n- `reuse_score` 不太稳定，因为它取决于用户实际使用的 Codex surface，以及 app-server 或 UI rename access 是否暴露。\n- `source_grade` 对官方文档和 GitHub issues 比较稳定；对产品页和项目自写文档要更谨慎。\n- `evidence_status` 对“公开记录是否存在”比较稳定，但对“当前 client 行为”不稳定，因为没有做 hands-on UI verification。\n\n## Judgment Report 的结论是否能指导行动？\n\n可以。报告把下一步收窄为：先审查 Case 1 输出，再用非私人 test thread 验证当前 Codex Desktop 或 app-server rename availability。验证前不应该设计更大的 title-governance workflow。\n\n这个结论也避免了两件事：一是直接改本地数据库，二是在 surface-specific safety 没确认前做大范围自动化。\n\n## Proposed future changes\n\n- 后续案例可以考虑增加轻量字段 `surface_scope`，用来标记 desktop app、VS Code extension、CLI、app-server、remote thread 或 web product。\n- Evidence Pack 可以更清楚地标记：哪些 private/local sources 是因为隐私原因有意不搜。\n- Strategy cards 后续可以提醒：official API capability 和 complete user-facing workflow support 不是一回事。\n"

    "raw": "# Case 1 Diagnostic Addendum\n\n## Purpose\n\nThis addendum records why Case 1 exposed a V1.1 framework gap. It does not replace the original Case 1 Evidence Pack or Judgment Report.\n\n## Diagnosis\n\nCase 1 found useful evidence, but the framework compressed several different claims into one broad title-management question.\n\nThe original case mixed at least these subproblems:\n\n- manual thread renaming;\n- app-server thread-name API support;\n- auto title generation;\n- fork or branch title lifecycle;\n- legacy or abnormal title cleanup;\n- batch review-based title governance;\n- direct local state or database edits.\n\nThose subproblems do not have the same answer. Some are already supported by official capability evidence, while others remain workflow gaps or evidence gaps.\n\n## Root Causes\n\n- Claim granularity was too coarse. Entity records grouped evidence by object, but not by capability claim.\n- `surface_scope` was missing. Desktop app, VS Code extension, CLI, app-server, remote thread, and local state are different surfaces.\n- `lifecycle_scope` was missing. Thread start, manual rename, fork, resume, read, legacy cleanup, and batch review are different lifecycle stages.\n- Freshness was not a hard gate. Older issues were useful for historical pain, but they could be overread as current missing-feature evidence.\n- Entity-level `reuse_score` was too broad. A high reuse score for app-server rename does not mean the same entity solves desktop batch governance.\n- Current UI or user-observed evidence was not recorded. The original retrospective already noted that current client behavior was not verified hands-on.\n\n## V1.1 Fix\n\nV1.1 adds a lightweight claim layer:\n\n- `Claim Decomposition` before search;\n- `Capability Claim Matrix` inside Evidence Pack;\n- `surface_scope`, `lifecycle_scope`, and `freshness_status` for each claim;\n- `score_scope` when an entity score only applies to a claim or surface;\n- claim-level local conclusions in Judgment Report.\n\nThis keeps Search and Judgment separated while letting Judgment say: one part is `直接采用`, another is `接入改造`, and another is `补齐缺口` or `先补证据`.\n\n## Case 1 Regression Target\n\nThe regression should not rerun all searches. It should only add current official capability and lifecycle evidence, then rejudge the case at claim level.\n\nThe minimum claim set is:\n\n- manual rename in the Codex app thread list;\n- app-server `thread/name/set`;\n- fork and thread-name lifecycle;\n- legacy or abnormal title handling;\n- batch review-based title governance;\n- direct local state or database edit path.\n"
  },

    "raw": "# Idea Card\n\n## Original Idea\n\nCodex 侧边栏里的 thread title 如果默认生成得不准，后面就很难找回对应任务。这个案例要判断：标题命名是否可控，官方是否已经有重命名能力，以及是否值得做一套安全的标题治理流程。\n\n## One-Sentence Goal\n\n判断 Codex sidebar title management 应该直接使用现有功能、接入改造已有能力、补齐工作流缺口，还是做一个小型自研原型。\n\n## User And Context\n\n- Primary user: 管理大量 Codex / 类 Codex 工作线程的用户。\n- Usage context: 在本地 Codex workspace 中查找、识别、重命名和整理侧边栏会话或任务标题。\n- Frequency or urgency: 当会话越来越多、默认标题不能反映真实任务时，这会反复影响检索和继续工作。\n\n## Input\n\n- 现有 Codex 侧边栏 thread list 或 task list。\n- 现有 thread titles、首条消息、最近真实意图和 case metadata。只有在安全且必要时才使用。\n- 用户认可的命名规则或标题约定。\n- 公开文档、公开 issue、社区讨论和可见产品能力。\n\n## Output\n\n- 一份可供判断的 Evidence Pack 和 Judgment Report，用来决定标题治理应依赖现有功能、接入已有工具、补齐窄工作流，还是先做小样。\n\n## Core Problem\n\n自动生成或默认生成的 conversation title 可能跟不上任务真实状态。标题不准会让旧工作更难找，也会增加打开、fork 或继续错误 thread 的风险。\n\n## Important Constraints\n\n- Time: 使用 `L2 standard scan`，不做完整产品审计或代码审计。\n- Cost: 如果现有官方能力或轻量工作流足够，优先复用。\n- Privacy or sensitivity: 不读取私人 Codex conversation content、本地数据库、账号文件或 `.codex` state，除非明确必要且安全。本案例优先依赖公开来源和非敏感项目上下文。\n- Technical environment: Windows 上的 Codex desktop 或类 Codex app 环境。\n- Quality bar: 任何标题治理流程都不能默认直接改本地数据库；改标题前应保留用户审查。\n\n## Suspected Uniqueness\n\n这个需求不是泛泛的 chat title editing。它更具体：给 Codex sidebar 工作线程做安全、可复核的 title governance，让标题同时反映稳定背景和最新真实进展。\n\n## Desired Reuse\n\n最值得复用的是官方 rename 功能、现有 Codex feature、公开 plugin/workflow、issue 中的社区模式，或者一个安全的操作清单。\n\n## Unacceptable Substitutes\n\n- 泛泛建议“少开一些 thread”。\n- 不经用户审查，直接修改本地 Codex 数据库。\n- 只能改浏览器 tab、文件名或无关 chat 产品标题的工具。\n- 全自动改标题，但没有 review 步骤。\n\n## Search Level\n\n`L2 standard scan`\n\n## Notes For Search Module\n\n可用搜索词包括 Codex sidebar title、Codex thread title、rename Codex conversation、ChatGPT project or chat rename、OpenAI Codex task、Codex CLI、conversation title management、issue、feature request 等。只有在公开来源不足且有明确安全理由时，才考虑本地或用户提供来源。\n"

      document.getElementById('docTitle').textContent = doc.title;
      document.getElementById('rawLink').href = doc.path;
      document.getElementById('doc').innerHTML = renderMarkdown(doc.raw);
      document.getElementById('meta').textContent = 'Source: ' + doc.path + ' · 使用浏览器打印可另存为 PDF';
      renderNav();
    }
    filter.addEventListener('input', renderNav); renderDoc();
  </script>
</body>
</html>
